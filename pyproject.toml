[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobigrad"
version = "0.0.1"
description = "A from-scratch reverse-mode autograd engine over batched tensors, with attention and transformer primitives."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Manikanta Harsha Nadimpalli", email = "nmharsha@stanford.edu" },
    { name = "Luis Blanco Hoyos", email = "blancol@stanford.edu" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
